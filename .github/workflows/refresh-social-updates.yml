name: Refresh social updates

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/refresh_social_updates.py
      - .github/workflows/refresh-social-updates.yml

permissions:
  contents: write

jobs:
  refresh-youtube:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Refresh YouTube feed
        run: python scripts/refresh_social_updates.py
      - name: Commit updated feed
        run: |
          if git diff --quiet -- data/social-updates.json; then
            echo "No feed changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/social-updates.json
          git commit -m "Refresh YouTube social updates"
          git push
